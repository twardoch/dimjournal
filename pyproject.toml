# this_file: pyproject.toml
[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "dimjournal"
description = "Archive utility for Midjourney"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
license = "Apache-2.0"
authors = [
    {name = "Adam Twardoch", email = "adam+github@twardoch.com"},
]
keywords = ["midjourney", "backup", "archive", "images"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "beautifulsoup4>=4.12.2",
    "fire>=0.5.0",
    "numpy>=1.25.0",
    "Pillow>=10.0.0",
    "pymtpng>=1.0",
    "python-slugify>=8.0.1",
    "selenium>=4.10.0",
    "tqdm>=4.65.0",
    "undetected-chromedriver>=3.5.0",
]

[project.urls]
Documentation = "https://twardoch.github.io/dimjournal/"
Source = "https://github.com/twardoch/dimjournal"
Issues = "https://github.com/twardoch/dimjournal/issues"

[project.scripts]
dimjournal = "dimjournal.__main__:cli"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-mock>=3.12",
]
dev = [
    "dimjournal[test]",
    "ruff>=0.9",
    "mypy>=1.10",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build]
exclude = ["/dist"]

[tool.hatch.build.targets.wheel]
packages = ["src/dimjournal"]

[tool.hatch.build.hooks.vcs]
version-file = "src/dimjournal/_version.py"

[tool.hatch.envs.default]
python = "3.12"
dependencies = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-mock>=3.12",
    "ruff>=0.9",
    "mypy>=1.10",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
lint = "ruff check {args:src tests}"
fmt = "ruff format {args:src tests}"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "SIM"]
ignore = ["E203", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "undetected_chromedriver",
    "undetected_chromedriver.*",
    "selenium",
    "selenium.*",
    "pymtpng",
    "slugify",
    "tqdm",
    "tqdm.*",
    "bs4",
    "bs4.*",
    "PIL",
    "PIL.*",
    "numpy",
    "numpy.*",
    "fire",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--tb=short",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*",
    "*/conftest.py",
    "*/setup.py",
    "*/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\(Protocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
